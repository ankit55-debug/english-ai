<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e5ddd5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 85%;
            max-width: 350px;
        }
        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 6px;
        }
        input {
            border: 1px solid #ccc;
        }
        button {
            border: none;
            background: #075e54;
            color: white;
            cursor: pointer;
        }
        #status {
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Reset Password</h2>
        <p>Enter your new password below.</p>

        <form id="resetForm">
            <input
                type="password"
                id="newPassword"
                placeholder="New password"
                minlength="6"
                required
            >
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="6"
                required
            >
            <button type="submit">Update Password</button>
        </form>

        <p id="status" role="status"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "YOUR_EXISTING_SUPABASE_URL";
        const SUPABASE_KEY = "YOUR_EXISTING_SUPABASE_PUBLISHABLE_KEY";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const statusElement = document.getElementById("status");

        document.getElementById("resetForm").addEventListener(
            "submit",
            async function(event) {
                event.preventDefault();

                const password =
                    document.getElementById("newPassword").value;
                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                if (password.length < 6) {
                    statusElement.textContent =
                        "Password must be at least 6 characters.";
                    return;
                }

                if (password !== confirmPassword) {
                    statusElement.textContent =
                        "Passwords do not match.";
                    return;
                }

                statusElement.textContent = "Updating password...";

                try {
                    const { data, error: sessionError } =
                        await supabaseClient.auth.getSession();

                    if (sessionError) throw sessionError;

                    if (!data.session) {
                        statusElement.textContent =
                            "Reset link is invalid or expired. Request a new one.";
                        return;
                    }

                    const { error } =
                        await supabaseClient.auth.updateUser({
                            password: password
                        });

                    if (error) throw error;

                    statusElement.textContent =
                        "Password updated successfully! You can now log in with your new password.";
                } catch (error) {
                    console.error(error);
                    statusElement.textContent =
                        error.message || "Could not update password.";
                }
            }
        );
    </script>
</body>
</html>
