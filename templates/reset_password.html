<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - English AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #e5ddd5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
        }

        input,
        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border-radius: 6px;
            font-size: 16px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            border: none;
            background: #075e54;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #status {
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        a {
            color: #075e54;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Reset Password</h2>
        <p>Enter your new password below.</p>

        <form id="resetForm">
            <input
                type="password"
                id="newPassword"
                placeholder="New password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="updateButton">
                Update Password
            </button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>

        <p>
            <a href="/login">Back to Login</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "YOUR_EXISTING_SUPABASE_URL";
        const SUPABASE_KEY = "YOUR_EXISTING_SUPABASE_PUBLISHABLE_KEY";

        const statusElement = document.getElementById("status");
        const form = document.getElementById("resetForm");
        const updateButton = document.getElementById("updateButton");

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true,
                    flowType: "implicit"
                }
            }
        );

        let recoveryReady = false;
        let recoveryError = null;

        async function prepareRecoverySession() {
            statusElement.textContent =
                "Checking password reset link...";

            try {
                // Allow Supabase to process the recovery URL.
                const url = new URL(window.location.href);
                const hashParams = new URLSearchParams(
                    url.hash.replace(/^#/, "")
                );

                const accessToken = hashParams.get("access_token");
                const refreshToken = hashParams.get("refresh_token");
                const urlError = hashParams.get("error_description");

                if (urlError) {
                    throw new Error(
                        urlError.replace(/\+/g, " ")
                    );
                }

                // Explicitly establish the session if tokens are present.
                if (accessToken && refreshToken) {
                    const { error } =
                        await supabaseClient.auth.setSession({
                            access_token: accessToken,
                            refresh_token: refreshToken
                        });

                    if (error) throw error;

                    // Remove tokens from the visible URL after processing.
                    history.replaceState(
                        null,
                        "",
                        window.location.pathname + window.location.search
                    );
                }

                const { data, error } =
                    await supabaseClient.auth.getSession();

                if (error) throw error;

                if (!data.session) {
                    throw new Error(
                        "No password recovery session was found. Please request a new reset email and open its latest link."
                    );
                }

                recoveryReady = true;
                statusElement.textContent =
                    "Reset link verified. Enter your new password.";
            } catch (error) {
                recoveryError = error;
                recoveryReady = false;
                statusElement.textContent =
                    error.message || "Could not verify the reset link.";
                console.error("Recovery session error:", error);
            }
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (!recoveryReady) {
                statusElement.textContent = recoveryError
                    ? (recoveryError.message ||
                       "Reset link is invalid or expired.")
                    : "Please wait while the reset link is verified.";
                return;
            }

            const password =
                document.getElementById("newPassword").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password.length < 6) {
                statusElement.textContent =
                    "Password must be at least 6 characters.";
                return;
            }

            if (password !== confirmPassword) {
                statusElement.textContent =
                    "Passwords do not match.";
                return;
            }

            updateButton.disabled = true;
            statusElement.textContent = "Updating password...";

            try {
                const { data: sessionData, error: sessionError } =
                    await supabaseClient.auth.getSession();

                if (sessionError) throw sessionError;

                if (!sessionData.session) {
                    throw new Error(
                        "Reset session expired. Please request a new reset email."
                    );
                }

                const { error } =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });

                if (error) throw error;

                statusElement.textContent =
                    "Password updated successfully! You can now log in.";

                form.reset();

                setTimeout(function() {
                    window.location.href = "/login";
                }, 2000);

            } catch (error) {
                console.error("Password update error:", error);
                statusElement.textContent =
                    error.message || "Could not update password.";
            } finally {
                updateButton.disabled = false;
            }
        });

        prepareRecoverySession();
    </script>
</body>
</html>
