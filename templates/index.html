 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>English AI Chat</title>

    <style>
        :root {
            --purple: #5126a8;
            --dark-purple: #241044;
            --blue: #247bff;
            --light-bg: #f4f2fb;
            --text: #211b32;
            --muted: #77718b;
            --border: #e7e1f2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #e9e0ff, transparent 40%),
                #f4f2fb;
            color: var(--text);
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .chat-box {
            max-width: 760px;
            height: 94vh;
            height: 94dvh;
            min-height: 450px;
            margin: 3vh auto;
            background: white;
            border: 1px solid rgba(111, 76, 180, 0.12);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(47, 25, 90, 0.15);
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        .header {
            position: relative;
            flex-shrink: 0;
            padding: 22px 18px 18px;
            color: white;
            text-align: center;
            background: linear-gradient(
                125deg,
                #241044 0%,
                #5126a8 48%,
                #247bff 100%
            );
        }

        .header::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            right: -70px;
            top: -100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        .brand {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 11px;
            position: relative;
            z-index: 1;
        }

        .logo {
            width: 43px;
            height: 43px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 23px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
        }

        .brand-text {
            text-align: left;
        }

        .brand-text h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 750;
            letter-spacing: 0.2px;
        }

        .brand-text p {
            margin: 4px 0 0;
            font-size: 12px;
            color: #e4dcff;
        }

        .group-badge {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 16px;
            padding: 7px 13px;
            max-width: 100%;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 255, 255, 0.18);
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .group-dot {
            width: 8px;
            height: 8px;
            flex-shrink: 0;
            border-radius: 50%;
            background: #76ffb1;
            box-shadow: 0 0 9px rgba(118, 255, 177, 0.7);
        }

        /* GROUP CONTROLS */

        .group-tools {
            display: flex;
            gap: 9px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
            position: relative;
            z-index: 1;
        }

        .header-button {
            min-height: 38px;
            padding: 9px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            background: rgba(255, 255, 255, 0.13);
            color: white;
            font-size: 12px;
            font-weight: 650;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .header-button:hover {
            background: rgba(255, 255, 255, 0.24);
            transform: translateY(-1px);
        }

        .invite-row {
            display: flex;
            gap: 7px;
            width: 100%;
            max-width: 480px;
            margin: 11px auto 0;
            position: relative;
            z-index: 1;
        }

        #inviteLink {
            min-width: 0;
            flex: 1;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 11px;
            outline: none;
            background: rgba(15, 9, 40, 0.24);
            color: white;
            font-size: 12px;
        }

        #inviteLink::placeholder {
            color: #ded6f8;
        }

        /* USER NAME */

        .name-area {
            flex-shrink: 0;
            padding: 12px 16px;
            background: #fff;
            border-bottom: 1px solid var(--border);
        }

        #username {
            display: block;
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            background: #faf9fe;
            color: var(--text);
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #username:focus,
        #message:focus {
            border-color: #7950d6;
            box-shadow: 0 0 0 3px rgba(121, 80, 214, 0.1);
        }

        /* CHAT AREA */

        #messages {
            flex: 1;
            min-height: 0;
            padding: 20px 16px;
            overflow-y: auto;
            overscroll-behavior: contain;
            background-image: url("/static/IMG_20260329_214920_625.jpg.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            scroll-behavior: smooth;
        }

        .date-label {
            width: fit-content;
            margin: 0 auto 18px;
            padding: 7px 12px;
            border-radius: 20px;
            background: #eee8fa;
            color: #66518c;
            font-size: 11px;
            font-weight: 650;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 13px;
        }

        .message-row.mine {
            align-items: flex-end;
        }

        .message {
            max-width: 85%;
            padding: 11px 14px;
            border: 1px solid #e9e4f2;
            border-radius: 5px 17px 17px 17px;
            background: white;
            color: #302743;
            box-shadow: 0 3px 9px rgba(43, 26, 79, 0.04);
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 14px;
        }

        .message-row.mine .message {
            border-color: transparent;
            border-radius: 17px 5px 17px 17px;
            background: linear-gradient(135deg, #6539c4, #4778ed);
            color: white;
        }

        .sender {
            display: block;
            margin-bottom: 5px;
            font-size: 11px;
            font-weight: 750;
            color: #7650bc;
        }

        .message-row.mine .sender {
            color: #e7ddff;
        }

        .message-text {
            display: block;
        }

        .ai {
            max-width: 85%;
            margin-top: 6px;
            padding: 11px 13px;
            border: 1px solid #d8e9ff;
            border-left: 4px solid #3983f6;
            border-radius: 5px 13px 13px 13px;
            background: #edf5ff;
            color: #24436d;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .ai-title {
            display: block;
            margin-bottom: 4px;
            color: #2563b8;
            font-weight: 750;
            font-size: 11px;
        }

        .empty-state {
            padding: 35px 12px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        .empty-icon {
            display: block;
            margin-bottom: 10px;
            font-size: 35px;
        }

        /* MESSAGE INPUT */

        .input-area {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 13px;
            border-top: 1px solid var(--border);
            background: white;
        }

        #message {
            flex: 1;
            min-width: 0;
            padding: 13px 16px;
            border: 1px solid #e4deef;
            border-radius: 25px;
            outline: none;
            background: #f8f7fc;
            color: var(--text);
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #message::placeholder {
            color: #9992a9;
        }

        #sendButton {
            flex-shrink: 0;
            min-width: 78px;
            padding: 13px 17px;
            border: none;
            border-radius: 24px;
            background: linear-gradient(135deg, #5126a8, #247bff);
            color: white;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(81, 38, 168, 0.2);
            transition: opacity 0.2s, transform 0.2s;
        }

        #sendButton:hover {
            transform: translateY(-1px);
        }

        #sendButton:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .footer-note {
            flex-shrink: 0;
            padding: 0 12px 10px;
            background: white;
            color: #948da5;
            text-align: center;
            font-size: 10px;
        }

        /* MOBILE */

        @media (max-width: 700px) {
            body {
                background: white;
            }

            .chat-box {
                width: 100%;
                max-width: none;
                height: 100vh;
                height: 100dvh;
                min-height: 0;
                margin: 0;
                border: none;
                border-radius: 0;
                box-shadow: none;
            }

            .header {
                padding: 16px 12px 14px;
            }

            .logo {
                width: 39px;
                height: 39px;
                border-radius: 13px;
                font-size: 21px;
            }

            .brand-text h1 {
                font-size: 19px;
            }

            .group-badge {
                margin-top: 12px;
            }

            .group-tools {
                margin-top: 11px;
                gap: 7px;
            }

            .header-button {
                padding: 8px 11px;
                min-height: 35px;
            }

            .invite-row {
                margin-top: 9px;
            }

            #inviteLink {
                font-size: 11px;
            }

            .name-area {
                padding: 10px 12px;
            }

            #messages {
                padding: 15px 11px;
            }

            .message,
            .ai {
                max-width: 90%;
            }

            .input-area {
                padding: 10px;
                gap: 7px;
            }

            #message {
                padding: 12px 14px;
                font-size: 16px;
            }

            #sendButton {
                min-width: 68px;
                padding: 12px 13px;
            }
        }

        @media (max-width: 360px) {
            .brand-text h1 {
                font-size: 17px;
            }

            .brand-text p {
                font-size: 11px;
            }

            .header-button {
                font-size: 11px;
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<div class="chat-box">

    <header class="header">

        <div class="brand">
            <div class="logo">🤖</div>

            <div class="brand-text">
                <h1>English AI Chat</h1>
                <p>Learn English together</p>
            </div>
        </div>

        <div class="group-badge">
            <span class="group-dot"></span>
            <span id="groupTitle">Loading group...</span>
        </div>

        <div class="group-tools">
            <button
                type="button"
                class="header-button"
                onclick="createGroup()"
            >
                ＋ Create Group
            </button>

            <button
                type="button"
                class="header-button"
                onclick="copyInviteLink()"
            >
                🔗 Copy Invite Link
            </button>
            <button
    type="button"
    class="header-button"
    onclick="logoutUser()"
>
    🚪 Logout
</button>
        </div>

        <div class="invite-row">
            <input
                type="text"
                id="inviteLink"
                placeholder="Your group invite link"
                readonly
                aria-label="Group invite link"
            >
        </div>

    </header>

    <div class="name-area">
        <input
            type="text"
            id="username"
            placeholder="Enter your name"
            maxlength="50"
            autocomplete="nickname"
            aria-label="Your name"
        >
    </div>

    <main id="messages" aria-live="polite">
        <div class="empty-state">
            <span class="empty-icon">💬</span>
            Loading your conversation...
        </div>
    </main>

    <form class="input-area" id="messageForm">
        <input
            type="text"
            id="message"
            placeholder="Write a message..."
            maxlength="5000"
            autocomplete="off"
            aria-label="Write a message"
        >

        <button type="submit" id="sendButton">
            Send ➤
        </button>
    </form>

    <div class="footer-note">
        Powered by English AI · Practice a little every day
    </div>

</div>

 <!-- WhatsApp Style Delete Menu -->
<div id="deleteMenu" style="
    display: none;
    position: fixed;
    z-index: 9999;
    background: #222;
    color: white;
    padding: 10px;
    border-radius: 10px;
    box-shadow: 0 4px 12px #0005;
">
    <button type="button" id="deleteForMeBtn">
        Delete for me
    </button>

    <button type="button" id="deleteForEveryoneBtn">
        Delete for everyone
    </button>
</div>
 
<script>
    const GROUP_ID = {{ group_id|default(1)|tojson }};
    const GROUP_NAME = {{ group_name|default('General')|tojson }};
    const SAVED_USERNAME = {{ group_username|default('')|tojson }};
    const CURRENT_USER_ID = {{ current_user_id|tojson }};

    const messagesElement = document.getElementById("messages");
    const messageInput = document.getElementById("message");
    const usernameInput = document.getElementById("username");
    const sendButton = document.getElementById("sendButton");
    const inviteInput = document.getElementById("inviteLink");

    document.getElementById("groupTitle").textContent = GROUP_NAME;

    // Show the invite link when the current page was opened from one.
    if (window.location.pathname.startsWith("/join/")) {
    inviteInput.value = window.location.href;
} else if (GROUP_NAME === "General") {
    inviteInput.value = window.location.origin + "/join/general-room";
}

   // Load the username saved for this specific group.
if (SAVED_USERNAME) {
    usernameInput.value = SAVED_USERNAME;
    usernameInput.readOnly = true;
    usernameInput.placeholder = "Username locked for this group";
} else {
    usernameInput.value = "";
    usernameInput.readOnly = false;
    usernameInput.placeholder = "Choose your name for this group";
}

     // SET AND LOCK USERNAME FOR THIS GROUP
async function setGroupUsername() {
    const username = usernameInput.value.trim();

    if (!username) {
        alert("Please enter your name first.");
        usernameInput.focus();
        return false;
    }

    if (username.length > 30) {
        alert("Name must be 30 characters or less.");
        return false;
    }

    try {
        const response = await fetch("/set_group_username", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                group_id: GROUP_ID,
                username: username
            })
        });

        const data = await response.json();

        if (!response.ok) {
            if (data.username) {
                usernameInput.value = data.username;
                usernameInput.readOnly = true;
            }

            alert(data.error || "Could not save your name.");
            return false;
        }

        usernameInput.value = data.username;
        usernameInput.readOnly = true;
        usernameInput.placeholder = "Username locked for this group";

        alert("Your username is saved for this group!");
        return true;

    } catch (error) {
        console.error("SET USERNAME ERROR:", error);
        alert("Server connection failed.");
        return false;
    }
}
    // CREATE GROUP
    async function createGroup() {
        const groupName = prompt("Enter group name:");

        if (!groupName || !groupName.trim()) {
            return;
        }

        try {
            const response = await fetch("/create_group", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: groupName.trim()
                })
            });

            const data = await response.json();

            if (!response.ok || !data.invite_link) {
                alert(data.error || "Group could not be created.");
                return;
            }

            const fullInviteLink = new URL(
                data.invite_link,
                window.location.origin
            ).href;

            inviteInput.value = fullInviteLink;

            if (data.group_id) {
                window.location.href = fullInviteLink;
            }

        } catch (error) {
            console.error("CREATE GROUP ERROR:", error);
            alert("Server connection failed. Please try again.");
        }
    }


    // COPY INVITE LINK
    async function copyInviteLink() {
        const inviteLink = inviteInput.value.trim();

        if (!inviteLink) {
            alert("No invite link available yet.");
            return;
        }

        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(inviteLink);
            } else {
                inviteInput.focus();
                inviteInput.select();

                const copied = document.execCommand("copy");

                if (!copied) {
                    alert("Please select and copy the invite link manually.");
                    return;
                }
            }

            alert("Invite link copied!");

        } catch (error) {
            inviteInput.focus();
            inviteInput.select();

            alert("Link selected. Please copy it manually.");
        }
    }


    // LOAD MESSAGES
    let isLoadingMessages = false;
    let lastMessageSignature = "";

    async function loadMessages() {
        if (isLoadingMessages) {
            return;
        }

        isLoadingMessages = true;

        try {
            const response = await fetch(
                `/messages?group_id=${encodeURIComponent(GROUP_ID)}`
            );

            if (!response.ok) {
                throw new Error("Could not load messages.");
            }

            const data = await response.json();

            if (!Array.isArray(data)) {
                throw new Error("Unexpected server response.");
            }

            // Avoid rebuilding the chat if nothing has changed.
            const signature = JSON.stringify(data);

            if (signature === lastMessageSignature) {
                return;
            }

            const wasNearBottom =
                messagesElement.scrollHeight -
                messagesElement.scrollTop -
                messagesElement.clientHeight < 100;

            messagesElement.replaceChildren();

            if (data.length === 0) {
                const empty = document.createElement("div");
                empty.className = "empty-state";

                const icon = document.createElement("span");
                icon.className = "empty-icon";
                icon.textContent = "💬";

                const text = document.createElement("div");
                text.textContent =
                    "No messages yet. Say hello and start practising English!";

                empty.append(icon, text);
                messagesElement.appendChild(empty);

            } else {
                data.forEach(function (item) {
                    const row = document.createElement("div");
                    row.className = "message-row";

                    if (
    item.user_id &&
    CURRENT_USER_ID &&
    String(item.user_id) === String(CURRENT_USER_ID)
) {
    row.classList.add("mine");
}

                    // Username
                    const sender = document.createElement("span");
                    sender.className = "sender";
                    sender.textContent = item.username || "User";

                    // Message bubble
                    const messageBubble = document.createElement("div");
                    messageBubble.className = "message";
                    messageBubble.dataset.messageld=item.id;

                    const messageText = document.createElement("span");
                    messageText.className = "message-text";

                    if (item.is_deleted === true) {
                        messageText.textContent = "This message was deleted";
                        messageText.style.fontStyle = "italic";
                        messageText.style.opacity = "0.75";
                    } else {
                        messageText.textContent = item.message || "";
                    }

                    messageBubble.append(sender, messageText);
                    row.appendChild(messageBubble);

                    // AI English correction
                    if (item.is_deleted !== true && item.correction) {
                        const aiBox = document.createElement("div");
                        aiBox.className = "ai";

                        const aiTitle = document.createElement("span");
                        aiTitle.className = "ai-title";
                        aiTitle.textContent = "✨ AI English Correction";

                        const aiText = document.createElement("div");
                        aiText.textContent = item.correction;

                        aiBox.append(aiTitle, aiText);
                        row.appendChild(aiBox);
                    }

                    messagesElement.appendChild(row);
                       
                });
            }

            lastMessageSignature = signature;

            if (wasNearBottom) {
                messagesElement.scrollTop = messagesElement.scrollHeight;
            }

        } catch (error) {
            console.error("LOAD MESSAGES ERROR:", error);
        } finally {
            isLoadingMessages = false;
        }
    }


    // SEND MESSAGE
    async function sendMessage(event) {
        event.preventDefault();

        const username = usernameInput.value.trim();
        const message = messageInput.value.trim();

        if (!username) {
            alert("Please enter your name first.");
            usernameInput.focus();
            return;
        }

        if (!message) {
            messageInput.focus();
            return;
        }
       // Save and lock username for this group.
if (!SAVED_USERNAME) {
    const saved = await setGroupUsername();

    if (!saved) {
        return;
    }
}

        sendButton.disabled = true;
        sendButton.textContent = "Sending...";

        try {
            const response = await fetch("/send", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    
                    message: message,
                    group_id: GROUP_ID
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Message could not be sent.");
            }

            // Clear the message only after the server accepts it.
            messageInput.value = "";

            // Force the next refresh to render updated messages.
            lastMessageSignature = "";

            await loadMessages();

            messageInput.focus();

        } catch (error) {
            console.error("SEND MESSAGE ERROR:", error);

            alert(
                "Message send nahi hua. Please try again.\n" +
                error.message
            );

        } finally {
            sendButton.disabled = false;
            sendButton.textContent = "Send ➤";
        }
    }


    // FORM SUBMIT
    document.getElementById("messageForm").addEventListener(
        "submit",
        sendMessage
    );


    // Initial load and automatic refresh
    loadMessages();
    setInterval(loadMessages, 2500);
async function logoutUser() {
    if (!confirm("Are you sure you want to logout?")) {
        return;
    }

    try {
        const response = await fetch("/logout", {
            method: "POST",
            credentials: "same-origin"
        });

        if (response.ok) {
            window.location.href = "/login";
        } else {
            alert("Logout failed. Please try again.");
        }
    } catch (error) {
        alert("Connection failed. Please try again.");
    }
}
 // WhatsApp style long-press delete menu
let selectedMessage = null;
let longPressTimer = null;

const deleteMenu = document.getElementById("deleteMenu");
const deleteForMeBtn = document.getElementById("deleteForMeBtn");
const deleteForEveryoneBtn = document.getElementById("deleteForEveryoneBtn");

function showDeleteMenu(messageBubble, x, y) {
    selectedMessage = messageBubble;

    const isMyMessage =
        String(messageBubble.dataset.userId) === String(CURRENT_USER_ID);

    deleteForEveryoneBtn.style.display = isMyMessage ? "block" : "none";

    deleteMenu.style.display = "block";

    const menuWidth = deleteMenu.offsetWidth;
    const menuHeight = deleteMenu.offsetHeight;

    deleteMenu.style.left = Math.max(
        5, Math.min(x, window.innerWidth - menuWidth - 5)
    ) + "px";

    deleteMenu.style.top = Math.max(
        5, Math.min(y, window.innerHeight - menuHeight - 5)
    ) + "px";
}

let startX = 0;
let startY = 0;

document.addEventListener("pointerdown", function (event) {
    const messageBubble = event.target.closest(".message");

    if (!messageBubble || !messageBubble.dataset.messageId) return;

    startX = event.clientX;
    startY = event.clientY;

    clearTimeout(longPressTimer);

    longPressTimer = setTimeout(function () {
        showDeleteMenu(messageBubble, startX, startY);
    }, 600);
});

document.addEventListener("pointerup", function () {
    clearTimeout(longPressTimer);
});

document.addEventListener("pointercancel", function () {
    clearTimeout(longPressTimer);
});

document.addEventListener("pointermove", function (event) {
    if (Math.hypot(event.clientX - startX, event.clientY - startY) > 15) {
        clearTimeout(longPressTimer);
    }
});

document.addEventListener("pointermove", function () {
    clearTimeout(longPressTimer);
});

document.addEventListener("contextmenu", function (event) {
    const messageBubble = event.target.closest(".message");

    if (messageBubble && messageBubble.dataset.messageId) {
        event.preventDefault();
        showDeleteMenu(messageBubble, event.clientX, event.clientY);
    }
});

deleteForMeBtn.addEventListener("click", function () {
    deleteSelectedMessage("me");
});

deleteForEveryoneBtn.addEventListener("click", function () {
    deleteSelectedMessage("everyone");
});

async function deleteSelectedMessage(deleteType) {
    if (!selectedMessage) return;

    try {
        const response = await fetch("/delete_message", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify({
                message_id: selectedMessage.dataset.messageId,
                group_id: GROUP_ID,
                delete_type: deleteType
            })
        });

        const result = await response.json();

        if (!response.ok) {
            alert(result.error || "Message delete failed");
            return;
        }

        deleteMenu.style.display = "none";
        selectedMessage = null;
        await loadMessages();

    } catch (error) {
        alert("Connection failed. Please try again.");
    }
}

document.addEventListener("click", function (event) {
    if (!deleteMenu.contains(event.target)) {
        deleteMenu.style.display = "none";
    }
});
</script>

</body>
</html>
